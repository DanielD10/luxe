name: photo-candidates
on:
  push:
    branches: [photo-check]
    paths: ["photo-check/queries.json", "photo-check/candidates.py"]
permissions:
  contents: write
jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow playwright && python -m playwright install --with-deps chromium
      - run: python photo-check/candidates.py
        timeout-minutes: 30
      - run: |
          git config user.name "photo-check"
          git config user.email "photo-check@users.noreply.github.com"
          git add -A photo-check/cand
          git commit -m "candidate sheets" || true
          git pull --rebase -q
          git push
