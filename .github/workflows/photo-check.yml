name: photo-check
on:
  push:
    branches: [photo-check]
    paths: ["photo-check/list.json"]
permissions:
  contents: write
jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python photo-check/sheets.py
      - run: |
          git config user.name "photo-check"
          git config user.email "photo-check@users.noreply.github.com"
          git add -A photo-check/out
          git commit -m "contact sheets" || true
          git push
