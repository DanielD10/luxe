name: live-check
on:
  push:
    branches: [photo-check]
    paths: ["photo-check/live.py", "photo-check/live-trigger.txt"]
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python photo-check/live.py
        timeout-minutes: 25
      - if: always()
        run: |
          git config user.name "photo-check"
          git config user.email "photo-check@users.noreply.github.com"
          git add -A photo-check/live
          git commit -m "live check" || true
          git pull --rebase -q
          git push
