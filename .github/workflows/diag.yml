name: photo-diag
on:
  push:
    branches: [photo-check]
    paths: ["photo-check/diag.py"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python photo-check/diag.py
      - run: |
          git config user.name "photo-check"
          git config user.email "photo-check@users.noreply.github.com"
          git add -A photo-check
          git commit -m "diag" || true
          git pull --rebase -q
          git push
