name: case-shot
on:
  push:
    branches: [photo-check]
    paths: ["photo-check/caseshot.py"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: mkdir -p photo-check/live && python photo-check/caseshot.py
      - if: always()
        run: |
          git config user.name "photo-check"
          git config user.email "photo-check@users.noreply.github.com"
          git add -A photo-check/live
          git commit -m "case shot" || true
          git pull --rebase -q
          git push
